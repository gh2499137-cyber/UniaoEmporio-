<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - União Empório</title>
    <link rel="stylesheet" href="css.css">
    <style>
        /* Estilos específicos da página de contato */
        .contato-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .form-group textarea {
            resize: vertical;
            height: 120px;
        }

        .btn-enviar {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s ease;
            width: 100%;
        }

        .btn-enviar:hover {
            background-color: #f36f21;
        }

        .info-atendimento {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .info-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <!-- Cabeçalho -->
    <header class="navbar">
        <div class="logo">UNIÃO EMPÓRIO</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
        <div class="cart-icon" id="cart-btn">🛒 Carrinho (<span id="cart-count">0</span>)</div>
    </header>

    <!-- Seção de Formolário e Contato -->
    <section>
        <h2>Fale Conosco</h2>
        
        <div class="contato-container">
            <form id="form-contato" onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" placeholder="Ex: Dúvidas sobre tamanhos, Entregas..." required>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>

            <div class="info-atendimento">
                <div class="info-card">
                    <h3>📧 E-mail</h3>
                    <p>contato@uniaoemporio.com</p>
                </div>
                <div class="info-card">
                    <h3>📱 WhatsApp</h3>
                    <p>(11) 99999-9999</p>
                </div>
                <div class="info-card">
                    <h3>⏰ Horário</h3>
                    <p>Seg. a Sex. - 08h às 18h</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 União Empório. Todos os direitos reservados.</p>
        <p>Desenvolvido para alta performance.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
